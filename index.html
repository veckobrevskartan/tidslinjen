<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Händelseöversikt</title>
    <style>
        html,body{margin:0;min-height:100%;background:#f4f7f6;font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#334}
        .timeline-loading{min-height:100dvh;display:grid;place-items:center;padding:24px;box-sizing:border-box;text-align:center}
        .timeline-loading strong{display:block;margin-bottom:6px}
    </style>
</head>
<body>
    <div class="timeline-loading" id="timeline-loading">
        <div><strong>Laddar tidslinjen…</strong><span>Händelser och filter förbereds.</span></div>
    </div>

<script>
(async () => {
    try {
        const response = await fetch('timeline-base.html', { cache: 'no-cache' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        let html = await response.text();

        html = html.replace(
            '</head>',
            '<link rel="stylesheet" href="mobile.css?v=20260809-2">\n</head>'
        );

        const marker = '    const myEvents = rawEvents';
        if (!html.includes(marker)) throw new Error('Datamarkören hittades inte i timeline-base.html');

        const currentLoader =
            '</scr' + 'ipt>\n' +
            '<script src="data/events-current.js?v=20260820-1"></scr' + 'ipt>\n' +
            '<script src="data/events-batch-20260820.js?v=20260820-1"></scr' + 'ipt>\n' +
            '<script src="data/apply-event-batch-20260820.js?v=20260820-1"></scr' + 'ipt>\n' +
            '<script src="data/events-batch-20260821.js?v=20260821-1"></scr' + 'ipt>\n' +
            '<script src="data/apply-event-batch-20260821.js?v=20260821-1"></scr' + 'ipt>\n' +
            '<script>\n' +
            '    if (Array.isArray(window.TIMELINE_CURRENT_EVENTS) && window.TIMELINE_CURRENT_EVENTS.length) {\n' +
            '        rawEvents.push(...window.TIMELINE_CURRENT_EVENTS);\n' +
            '    }\n' +
            '    const myEvents = rawEvents';

        html = html.replace(marker, currentLoader);

        html = html.replace(
            '</body>',
            '<script src="mobile.js?v=20260809-2"></scr' + 'ipt>\n</body>'
        );

        document.open();
        document.write(html);
        document.close();
    } catch (err) {
        console.error(err);
        document.body.innerHTML =
            '<div class="timeline-loading"><div><strong>Tidslinjen kunde inte laddas.</strong><span>Uppdatera sidan och försök igen.</span></div></div>';
    }
})();
</script>
</body>
</html>
